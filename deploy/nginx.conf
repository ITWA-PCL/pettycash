# Versioned assets can be reused; unversioned URLs must be revalidated.
map $arg_v $pettycash_static_cache_control {
    ""      "public, max-age=0, must-revalidate";
    default "public, max-age=86400, must-revalidate";
}

server {
    listen 8080;
    server_name pettycash.windowasia.com;
    client_max_body_size 20m;
    add_header X-Pettycash-Release "${DEPLOY_SHA}" always;
    location /static/ {
        alias /static/;
        autoindex off;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain;
        add_header Cache-Control $pettycash_static_cache_control;
        # Location add_header directives replace inheritance on nginx 1.28.
        add_header X-Pettycash-Release "${DEPLOY_SHA}" always;
    }
    # Private attachments use Django authenticated routes; no media mount here.
    location /media/ { return 404; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host pettycash.windowasia.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
}
