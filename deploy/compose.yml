name: pettycash
services:
  web:
    image: pettycash-app:${DEPLOY_SHA:?required}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: /var/www/Pettycash/shared/production.env
    environment:
      DJANGO_SETTINGS_MODULE: deploy.production
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "deploy.readiness"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  daily-reminders:
    profiles: [schedulers]
    image: pettycash-app:${DEPLOY_SHA:?required}
    env_file: /var/www/Pettycash/shared/production.env
    environment:
      DJANGO_SETTINGS_MODULE: deploy.production
    command: >
      sh -c 'while true; do python manage.py auto_confirm_receipts; python manage.py send_daily_pending_reminders --if-due; sleep 300; done'
    volumes:
      - media:/app/media
    networks: [backend]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  log-cleanup:
    profiles: [schedulers]
    image: pettycash-app:${DEPLOY_SHA:?required}
    env_file: /var/www/Pettycash/shared/production.env
    environment:
      DJANGO_SETTINGS_MODULE: deploy.production
    command: >
      sh -c 'while true; do python manage.py cleanup_expired_logs; sleep 86400; done'
    networks: [backend]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  gateway:
    image: nginx:1.28-alpine
    environment:
      DEPLOY_SHA: ${DEPLOY_SHA:?required}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - static:/static:ro
    networks: [backend, proxy]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:?verify live network}"
      traefik.http.routers.pettycash.rule: "Host(`pettycash.windowasia.com`)"
      traefik.http.routers.pettycash.entrypoints: "${TRAEFIK_ENTRYPOINT:?verify live entrypoint}"
      traefik.http.routers.pettycash.tls: "true"
      traefik.http.routers.pettycash.tls.certresolver: "${TRAEFIK_CERTRESOLVER:?verify live resolver}"
      traefik.http.services.pettycash.loadbalancer.server.port: "8080"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  backend:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?required}
volumes:
  database:
  media:
  static:
