name: Security & Build Gatekeeper
on:
  pull_request:
    branches: [main]
  push:
    branches: [process-flow, security]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  secret-scan:
    name: Leaked Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
  verify-and-build:
    name: Django Tests & Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pettycash_ci
          POSTGRES_USER: pettycash_ci
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pettycash_ci -d pettycash_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-disposable-key-not-used-for-deployment-or-any-real-data
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: pettycash_ci
      POSTGRES_USER: pettycash_ci
      POSTGRES_PASSWORD: ci-only-ephemeral-password
      REDIS_URL: redis://127.0.0.1:6379/0
      AD_GATEWAY_URL: ''
      AD_APP_ID: ''
      AD_SECRET_KEY: ''
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_GROUP_CHAT_ID: ''
      TELEGRAM_WEBHOOK_SECRET: ''
      PUBLIC_BASE_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Django, migrations and existing test suite
        run: |
          set -euo pipefail
          python -m pip check
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput
      - name: Verify deployment scripts and production image
        run: |
          set -euo pipefail
          bash -n deploy/deploy.sh
          bash -n deploy/preflight-readonly.sh
          docker build --file deploy/Dockerfile --tag pettycash-ci:${{ github.sha }} .

