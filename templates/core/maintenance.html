<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กำลังปรับปรุงระบบ | Petty Cash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Prompt,Arial,sans-serif;color:#102d50}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#eff8ff 0%,#f9fcff 55%,#e8f4ff 100%)}body:before,body:after{position:fixed;border-radius:50%;background:#1685db12;content:""}body:before{width:34rem;height:34rem;top:-18rem;left:-11rem}body:after{width:27rem;height:27rem;right:-13rem;bottom:-15rem}.maintenance-card{position:relative;width:min(31rem,calc(100% - 2.5rem));padding:3.25rem 2.5rem 2.4rem;border:1px solid #d9e8f6;border-radius:28px;background:rgba(255,255,255,.9);box-shadow:0 24px 65px rgba(28,79,126,.12);text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:.55rem;color:#145d9e;font-weight:700;font-size:1.02rem}.brand-mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#1679d0;color:#fff;font-weight:800}.loader{position:relative;width:82px;height:82px;margin:2rem auto 1.4rem;border:5px solid #e1f1fd;border-top-color:#1985da;border-radius:50%;animation:spin 1.15s linear infinite}.loader:after{position:absolute;inset:14px;border-radius:50%;background:#ddf4e9;content:""}.loader span{position:absolute;z-index:1;inset:0;display:grid;place-items:center;color:#078457;font-size:1.3rem;font-weight:800;animation:unspin 1.15s linear infinite}.eyebrow{color:#078457;font-size:.72rem;font-weight:800;letter-spacing:.13em}.maintenance-card h1{margin:.55rem 0 .65rem;color:#103b6b;font-size:clamp(1.75rem,6vw,2.35rem);line-height:1.25}.message{margin:0;color:#5d7490;font-size:.95rem;line-height:1.8}.status{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1.7rem 0 0;padding:.8rem 1rem;border:1px solid #d8e8f7;border-radius:12px;background:#f8fbff;color:#52718e;font-size:.82rem}.status i{width:8px;height:8px;border-radius:50%;background:#16aa71;box-shadow:0 0 0 5px #16aa711a;animation:pulse 1.5s infinite}.admin-access{display:inline-flex;align-items:center;justify-content:center;margin-top:1.2rem;padding:.55rem .95rem;border:1px solid #a9cae8;border-radius:9px;color:#176db4;background:#fff;text-decoration:none;font-size:.78rem;font-weight:600;transition:.18s}.admin-access:hover{border-color:#176db4;background:#f4f9ff}.retry{margin:.8rem 0 0;color:#8498ae;font-size:.76rem}@keyframes spin{to{transform:rotate(360deg)}}@keyframes unspin{to{transform:rotate(-360deg)}}@keyframes pulse{50%{transform:scale(.72);opacity:.55}}@media(max-width:480px){.maintenance-card{padding:2.6rem 1.5rem 2rem;border-radius:22px}}
  </style>
</head>
<body><main class="maintenance-card"><div class="brand"><span class="brand-mark">฿</span> Petty Cash</div><div class="loader"><span>⚙</span></div><div class="eyebrow">SYSTEM MAINTENANCE</div><h1>กำลังปรับปรุงระบบ</h1><p class="message">{{ message }}</p><div class="status"><i></i>กำลังเตรียมระบบให้พร้อมใช้งาน</div>{% if user.is_authenticated %}<a class="admin-access" href="{% url 'system_settings' %}">ไปยังการตั้งค่าระบบ</a>{% else %}<a class="admin-access" href="{% url 'login' %}?maintenance_admin=1">สำหรับผู้ดูแลระบบ</a>{% endif %}<p class="retry">กรุณาลองใหม่อีกครั้งในภายหลัง</p></main></body>
</html>
